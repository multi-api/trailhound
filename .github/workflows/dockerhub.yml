name: Docker Hub

# Copies a version's multi-architecture image from ghcr.io to Docker Hub.
# Runs by hand for a version already released, and from the release workflow.
# Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to copy, without the "v" (for example 0.1.0)
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  copy:
    name: Copy ${{ inputs.version }} to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the image and move the latest tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          source="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          target="docker.io/${{ vars.DOCKERHUB_USERNAME }}/trailhound"
          docker buildx imagetools create -t "$target:$VERSION" -t "$target:latest" "$source"
          docker buildx imagetools inspect "$target:$VERSION"
