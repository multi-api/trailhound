name: Release

# Pushing a tag like v0.1.0 builds the binaries, creates a draft GitHub
# release with them, and publishes the Docker image to ghcr.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, exe: trailhound }
          - { os: ubuntu-24.04-arm, name: linux-aarch64, exe: trailhound }
          - { os: macos-latest, name: macos-aarch64, exe: trailhound }
          - { os: windows-latest, name: windows-x86_64, exe: trailhound.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          dir="trailhound-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE CHANGELOG.md "$dir/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$dir.zip" "$dir"; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            trailhound-*.tar.gz
            trailhound-*.zip

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Trailhound ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."

  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image for this architecture
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$image:${GITHUB_REF_NAME#v}-${{ matrix.arch }}" .
          docker push "$image:${GITHUB_REF_NAME#v}-${{ matrix.arch }}"

  docker-manifest:
    name: Docker multi-architecture tag
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join both architectures under the version and latest tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$image:$version-amd64" "$image:$version-arm64"

  dockerhub:
    name: Docker Hub
    needs: docker-manifest
    # Only when Docker Hub publishing has been set up for the repository.
    if: vars.DOCKERHUB_USERNAME != ''
    uses: ./.github/workflows/dockerhub.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
